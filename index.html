<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1729"><title>MyTravel V1.1</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#eaf2ff;background:#0a1425}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0a1425,#122943);min-height:100vh}header{padding:24px max(18px,calc((100vw - 1150px)/2));background:#101f36;border-bottom:1px solid #29425f}h1{margin:0;font-size:27px}header p{margin:6px 0;color:#a9c0d9}.shell{max-width:1150px;margin:auto;padding:20px 16px 50px}nav{display:flex;gap:8px;overflow:auto;padding-bottom:12px}button,.button{border:1px solid #3d5878;border-radius:10px;background:#203a59;color:#eef6ff;padding:10px 14px;font:inherit;cursor:pointer}button:hover{background:#2b527c}button.active,.primary{background:#1675bc;border-color:#339be0}button.danger{background:#552e39;border-color:#ad5966}button.small{padding:6px 9px;font-size:13px}section{display:none}section.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:#15263e;border:1px solid #2c4664;border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 7px 25px #0002}h2{font-size:22px;margin:3px 0 18px}h3{font-size:17px;margin:0 0 12px}.muted,small{color:#a7bed5}.stat{font-size:23px;font-weight:750;margin:8px 0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.entries{display:grid;gap:9px}.entry{border:1px solid #304963;border-radius:11px;padding:13px;background:#112038;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.entry strong{display:block;margin-bottom:5px}.entry p{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:grid;gap:5px;margin:0 0 12px}label{font-size:13px;color:#b8cde1}input,select,textarea{width:100%;padding:11px;background:#0b1a2d;border:1px solid #3d5878;border-radius:9px;color:#fff;font:inherit}textarea{min-height:85px;resize:vertical}.wide{grid-column:1/-1}.formactions{display:flex;gap:9px;flex-wrap:wrap}dialog{background:#14253d;color:#f1f7ff;border:1px solid #456181;border-radius:16px;width:min(680px,calc(100% - 24px));max-height:90vh;overflow:auto;padding:22px}dialog::backdrop{background:#000a}.pill{display:inline-block;background:#244665;border-radius:30px;padding:4px 9px;font-size:12px;color:#cde8fc}.notice{border-left:3px solid #5fa8e3;padding:12px;background:#142b46;border-radius:6px;color:#c9ddf1}a{color:#91d0ff}.checkline{display:flex;gap:9px;align-items:center}.checkline input{width:auto}#toast{position:fixed;bottom:20px;right:20px;background:#1f694f;color:white;padding:12px 18px;border-radius:10px;display:none;z-index:4}@media(max-width:600px){.entry{display:block}.actions{justify-content:flex-start;margin-top:10px}header{padding:19px}nav button{white-space:nowrap}}
</style></head><body><header><h1>✈ MyTravel <span class="pill">V1.1</span></h1><p>Your personal travel organiser · Plans, documents, vaccinations and more</p></header><main class="shell"><nav id="nav"></nav><div id="views"></div></main><dialog id="editor"><div class="toolbar"><h2 id="editorTitle">Add item</h2><button onclick="document.getElementById('editor').close()">✕</button></div><form id="editForm"><div id="fields" class="formgrid"></div><div class="formactions"><button type="submit" class="primary">Save</button><button type="button" onclick="document.getElementById('editor').close()">Cancel</button></div></form></dialog><div id="toast" role="status"></div><input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
'use strict';const KEY='mytravel-v1-data',UNDO_KEY='mytravel-v1-last-deletion';const tabs=[['dashboard','Dashboard'],['trips','Trips'],['itinerary','Itinerary'],['stays','Accommodation'],['transport','Transport'],['vaccines','Vaccinations'],['documents','Documents'],['packing','Packing'],['expenses','Expenses'],['settings','Settings']];
const schemas={trips:[['name','Trip name','text',true],['destination','Destination','text',true],['start','Departure date','date'],['end','Return date','date'],['notes','Notes','textarea']],itinerary:[['date','Date','date'],['time','Time','time'],['title','Activity / place','text',true],['location','Location','text'],['details','Details / booking reference','textarea']],stays:[['name','Hotel / accommodation','text',true],['location','Location','text'],['checkin','Check-in','date'],['checkout','Check-out','date'],['reference','Booking reference','text'],['notes','Notes','textarea']],transport:[['type','Transport type','select',false,['Flight','Train','Car','Bus','Taxi','Other']],['provider','Airline / provider','text'],['from','From','text'],['to','To','text'],['date','Departure date','date'],['time','Departure time','time'],['reference','Booking reference','text'],['notes','Notes','textarea']],vaccines:[['name','Vaccine / medication','text',true],['date','Date received','date'],['dose','Dose / course','text'],['next','Next dose / booster date','date'],['provider','Clinic / provider','text'],['notes','Notes','textarea']],documents:[['name','Document name','text',true],['reference','Reference / number (optional)','text'],['expiry','Expiry date','date'],['location','Where stored','text'],['notes','Notes','textarea']],packing:[['name','Item','text',true],['category','Category','select',false,['Essentials','Clothing','Electronics','Toiletries','Medication','Other']],['notes','Notes','text']],expenses:[['name','Expense','text',true],['amount','Amount','number'],['currency','Currency','select',false,['GBP','INR','USD','EUR','Other']],['date','Date','date'],['category','Category','select',false,['Flights','Hotels','Transport','Food','Activities','Other']],['notes','Notes','textarea']]};
const singular={trips:'trip',itinerary:'activity',stays:'accommodation',transport:'transport',vaccines:'vaccination',documents:'document',packing:'packing item',expenses:'expense'};const titles={trips:'Your trips',itinerary:'Daily itinerary',stays:'Accommodation',transport:'Flights & transport',vaccines:'Vaccination records',documents:'Travel documents',packing:'Packing checklist',expenses:'Travel expenses'};
let data=load(),tab='dashboard',editing=null;function blank(){return {trips:[],itinerary:[],stays:[],transport:[],vaccines:[],documents:[],packing:[],expenses:[],activeTrip:null}}function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&typeof o==='object')return {...blank(),...o}}catch(e){}return blank()}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));toast('Saved on this device')}catch(e){alert('Could not save data. Check available browser storage.')}}function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prettyDate(s){if(!s)return '';let p=s.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s}function currentTrip(){return data.trips.find(x=>x.id===data.activeTrip)||null}function scoped(k){return k==='trips'?data.trips:k==='vaccines'?data.vaccines:(data[k]||[]).filter(x=>x.tripId===data.activeTrip)}function go(k){tab=k;render()}function render(){document.getElementById('nav').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');document.getElementById('views').innerHTML=tabs.map(([id])=>`<section class="${tab===id?'active':''}" id="view-${id}">${content(id)}</section>`).join('')}
function content(k){if(k==='dashboard')return dashboard();if(k==='settings')return settings();let t=currentTrip(),intro=k==='trips'?'Create a trip, then select it to organise the details.':k==='vaccines'?'Your personal vaccination history, kept independently of any trip.':!t?'Create and select a trip on the Trips tab first.':`Currently organising: <strong>${esc(t.name)}</strong>`;let arr=scoped(k),sorted=[...arr].sort((a,b)=>(a.date||a.start||a.checkin||'').localeCompare(b.date||b.start||b.checkin||''));return `<div class="toolbar"><div><h2>${titles[k]}</h2><p class="muted">${intro}</p></div><button class="primary" ${k!=='trips'&&k!=='vaccines'&&!t?'disabled':''} onclick="openEdit('${k}')">+ Add ${singular[k]}</button></div>${k==='vaccines'?'<p class="notice">A personal record only, not medical advice. Confirm recommended vaccines, booster requirements and dates with a travel clinic. Avoid storing highly sensitive medical documents or identification numbers on a shared device.</p>':''}${k==='documents'?'<p class="notice">This section stores notes and references only, not uploaded files. For security, avoid entering full passport numbers or other sensitive credentials.</p>':''}<div class="entries">${sorted.length?sorted.map(x=>entry(k,x)).join(''):'<div class="card muted">No entries yet.</div>'}</div>`}
function entry(k,x){let main=x.name||x.title||x.provider||x.type||'Entry';let sub=schemas[k].filter(([field])=>field!=='name'&&field!=='title'&&field!=='notes'&&field!=='checked').map(([field,label])=>x[field]!==undefined&&x[field]!==''?`${esc(label)}: ${esc(field==='amount'?Number(x[field]).toFixed(2):field==='date'||field==='start'||field==='end'||field==='checkin'||field==='checkout'||field==='expiry'||field==='next'?prettyDate(x[field]):x[field])}`:null).filter(Boolean).join(' · ');return `<div class="entry"><div>${k==='packing'?`<label class="checkline"><input type="checkbox" ${x.checked?'checked':''} onchange="togglePacked('${x.id}',this.checked)"><strong>${esc(main)}</strong></label>`:`<strong>${esc(main)}</strong>`}${sub?`<small>${sub}</small>`:''}${x.notes?`<p class="muted">${esc(x.notes)}</p>`:''}${k==='trips'?`<p><button class="small ${data.activeTrip===x.id?'primary':''}" onclick="chooseTrip('${x.id}')">${data.activeTrip===x.id?'✓ Selected':'Select trip'}</button></p>`:''}</div><div class="actions"><button class="small" onclick="openEdit('${k}','${x.id}')">Edit</button><button class="small danger" onclick="removeItem('${k}','${x.id}')">Delete</button></div></div>`}
function dashboard(){let t=currentTrip(),p=scoped('packing'),count=p.filter(x=>x.checked).length,exp=scoped('expenses'),byCurrency={};exp.forEach(x=>{let c=x.currency||'GBP';byCurrency[c]=(byCurrency[c]||0)+(Number(x.amount)||0)});return `<h2>Travel overview</h2><div class="grid"><div class="card"><h3>Current trip</h3><div class="stat">${t?esc(t.name):'No trip selected'}</div><p class="muted">${t?esc(t.destination||''):'Create a trip to get started.'}</p><p>${t?`${prettyDate(t.start)} ${t.end?'– '+prettyDate(t.end):''}`:''}</p><button onclick="go('trips')">Manage trips</button></div><div class="card"><h3>Planned activities</h3><div class="stat">${scoped('itinerary').length}</div><p class="muted">Items on your itinerary</p><button onclick="go('itinerary')">View itinerary</button></div><div class="card"><h3>Packing progress</h3><div class="stat">${count} / ${p.length}</div><p class="muted">Items packed</p><button onclick="go('packing')">Open checklist</button></div><div class="card"><h3>Vaccination records</h3><div class="stat">${scoped('vaccines').length}</div><p class="muted">Your vaccination history</p><button onclick="go('vaccines')">View records</button></div></div><div class="card"><h3>Recorded expenses</h3><p class="stat">${Object.entries(byCurrency).map(([c,n])=>`${esc(c)} ${n.toFixed(2)}`).join(' · ')||'None yet'}</p><p class="muted">Currencies are shown separately; no exchange rate is assumed.</p></div><div class="card"><h3>Getting started</h3><p>Create a trip, select it, then add accommodation, transport, activities, vaccination notes and packing items. Use Settings to export a JSON backup.</p><p class="notice">MyTravel V1 stores data only in this browser on this device. It does not yet synchronise with other devices. Use backup and restore to transfer records, and keep your backup somewhere safe.</p></div>`}
function settings(){return `<h2>Settings & backup</h2><div class="card"><h3>Safety & recovery</h3><p class="muted">Trip deletion is blocked when linked records exist. Vaccinations are stored independently of trips. You can undo the most recent deletion on this device.</p><button onclick="undoDeletion()">Undo last deletion</button></div><div class="card"><h3>Export your data</h3><p class="muted">Download a JSON backup containing all trips and their records.</p><button class="primary" onclick="backup()">Download JSON backup</button></div><div class="card"><h3>Restore from backup</h3><p class="muted">Restoring replaces all existing MyTravel data on this device. Export a backup first.</p><button onclick="document.getElementById('importFile').click()">Choose JSON backup</button></div><div class="card"><h3>Data & privacy</h3><p>Your entries are saved in your browser's local storage. They are not uploaded to a server by this app. Clearing browser data, using a different browser, or opening the HTML file directly may show a different or empty set of records.</p><p>For medical notes, store only what you need and keep sensitive documents in a secure location.</p></div><div class="card"><h3>Reset</h3><button class="danger" onclick="resetData()">Delete all local MyTravel data</button></div>`}
function openEdit(k,id){if(k!=='trips'&&k!=='vaccines'&&!data.activeTrip)return alert('Please select a trip first.');editing={k,id};let x=id?data[k].find(z=>z.id===id):{};document.getElementById('editorTitle').textContent=(id?'Edit ':'Add ')+singular[k];document.getElementById('fields').innerHTML=schemas[k].map(([field,label,type,required,opts])=>`<div class="field ${type==='textarea'?'wide':''}"><label for="f_${field}">${esc(label)}</label>${type==='textarea'?`<textarea id="f_${field}" name="${field}">${esc(x[field]||'')}</textarea>`:type==='select'?`<select id="f_${field}" name="${field}">${opts.map(o=>`<option ${x[field]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${field}" name="${field}" type="${type}" ${required?'required':''} ${type==='number'?'step="0.01" min="0"':''} value="${esc(x[field]??'')}">`}</div>`).join('');document.getElementById('editor').showModal()}
document.getElementById('editForm').addEventListener('submit',e=>{e.preventDefault();let {k,id}=editing,values=Object.fromEntries(new FormData(e.currentTarget).entries());if(id){let x=data[k].find(z=>z.id===id);Object.assign(x,values)}else{data[k].push({...values,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),tripId:k==='trips'||k==='vaccines'?null:data.activeTrip,checked:false})}if(k==='trips'&&!data.activeTrip)data.activeTrip=data.trips[0].id;save();document.getElementById('editor').close();render()});function chooseTrip(id){data.activeTrip=id;save();render()}function togglePacked(id,checked){let x=data.packing.find(x=>x.id===id);if(x){x.checked=checked;save();render()}}function removeItem(k,id){
 if(k==='trips'){
   const counts=Object.keys(schemas).filter(s=>s!=='trips'&&s!=='vaccines').map(s=>[s,data[s].filter(x=>x.tripId===id).length]).filter(x=>x[1]);
   if(counts.length){alert('This trip still has linked records ('+counts.map(x=>x[0]+': '+x[1]).join(', ')+'). To protect your information, MyTravel will NOT delete it. You can edit the trip details instead.');return;}
   if(!confirm('Delete this empty trip? Your vaccination history will be kept.'))return;
 }else if(!confirm('Delete this '+singular[k]+'? You can undo the last deletion in Settings.'))return;
 try{localStorage.setItem(UNDO_KEY,JSON.stringify(data))}catch(e){alert('Cannot create safety copy. Nothing has been deleted.');return}
 data[k]=data[k].filter(x=>x.id!==id);
 if(k==='trips'&&data.activeTrip===id)data.activeTrip=data.trips[0]?.id||null;
 save();render();toast('Deleted. Undo available in Settings.');
}
function undoDeletion(){const raw=localStorage.getItem(UNDO_KEY);if(!raw)return alert('No deletion to undo on this device.');if(!confirm('Restore the data saved just before your last deletion? Changes made since that deletion will be replaced.'))return;try{const old=JSON.parse(raw);if(!Array.isArray(old.trips))throw Error('Invalid safety copy');data={...blank(),...old};save();localStorage.removeItem(UNDO_KEY);render();alert('Previous data restored.')}catch(e){alert('Could not restore: '+e.message)}}
function backup(){let blob=new Blob([JSON.stringify({app:'MyTravel',version:1,exported:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MyTravel_Backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(o.app!=='MyTravel'||!o.data||!Array.isArray(o.data.trips))throw Error('Not a valid MyTravel backup');if(!confirm('Replace all MyTravel data on this device with this backup?'))return;data={...blank(),...o.data};for(let k of Object.keys(schemas))if(!Array.isArray(data[k]))data[k]=[];save();render();alert('Backup restored successfully.')}catch(err){alert('Restore failed: '+err.message)}finally{e.target.value=''}});function resetData(){if(confirm('Delete ALL local MyTravel records? This cannot be undone without a backup.')&&confirm('Are you absolutely sure?')){try{localStorage.setItem(UNDO_KEY,JSON.stringify(data))}catch(e){alert('Cannot create safety copy; reset cancelled.');return}data=blank();save();render()}}render();
</script></body></html>
