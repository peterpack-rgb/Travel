:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#eaf2ff;background:#0a1425}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0a1425,#122943);min-height:100vh}header{padding:24px max(18px,calc((100vw - 1150px)/2));background:#101f36;border-bottom:1px solid #29425f}h1{margin:0;font-size:27px}header p{margin:6px 0;color:#a9c0d9}.shell{max-width:1150px;margin:auto;padding:20px 16px 50px}nav{display:flex;gap:8px;overflow:auto;padding-bottom:12px}button,.button{border:1px solid #3d5878;border-radius:10px;background:#203a59;color:#eef6ff;padding:10px 14px;font:inherit;cursor:pointer}button:hover{background:#2b527c}button.active,.primary{background:#1675bc;border-color:#339be0}button.danger{background:#552e39;border-color:#ad5966}button.small{padding:6px 9px;font-size:13px}section{display:none}section.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:#15263e;border:1px solid #2c4664;border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 7px 25px #0002}h2{font-size:22px;margin:3px 0 18px}h3{font-size:17px;margin:0 0 12px}.muted,small{color:#a7bed5}.stat{font-size:23px;font-weight:750;margin:8px 0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.entries{display:grid;gap:9px}.entry{border:1px solid #304963;border-radius:11px;padding:13px;background:#112038;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.entry strong{display:block;margin-bottom:5px}.entry p{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:grid;gap:5px;margin:0 0 12px}label{font-size:13px;color:#b8cde1}input,select,textarea{width:100%;padding:11px;background:#0b1a2d;border:1px solid #3d5878;border-radius:9px;color:#fff;font:inherit}textarea{min-height:85px;resize:vertical}.wide{grid-column:1/-1}.formactions{display:flex;gap:9px;flex-wrap:wrap}dialog{background:#14253d;color:#f1f7ff;border:1px solid #456181;border-radius:16px;width:min(680px,calc(100% - 24px));max-height:90vh;overflow:auto;padding:22px}dialog::backdrop{background:#000a}.pill{display:inline-block;background:#244665;border-radius:30px;padding:4px 9px;font-size:12px;color:#cde8fc}.notice{border-left:3px solid #5fa8e3;padding:12px;background:#142b46;border-radius:6px;color:#c9ddf1}a{color:#91d0ff}.checkline{display:flex;gap:9px;align-items:center}.checkline input{width:auto}#toast{position:fixed;bottom:20px;right:20px;background:#1f694f;color:white;padding:12px 18px;border-radius:10px;display:none;z-index:4}@media(max-width:600px){.entry{display:block}.actions{justify-content:flex-start;margin-top:10px}header{padding:19px}nav button{white-space:nowrap}}
#cloudStatus{overflow-wrap:anywhere}.syncok{color:#73d6b1}.syncwarn{color:#ffd18b}.syncerr{color:#ff9b9b}.cloudactions{display:flex;flex-wrap:wrap;gap:9px}.cloudactions button{flex:1;min-width:165px}#journalMap{height:360px;border-radius:12px;background:#18324d;z-index:0}.journalPhoto{max-width:100%;max-height:240px;border-radius:10px;margin-top:9px}.journalActions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.journalLocation{font-size:13px;color:#b8d8f1}.leaflet-container{font-family:system-ui,sans-serif}#journalEditor{max-width:650px}.journalHint{font-size:13px;color:#a7bed5}

</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyo4r9Gzv+H1rNfWw=" crossorigin=""><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><header><h1>✈ MyTravel <span class="pill">V1.4.1</span></h1><p>Your personal travel organiser · Plans, documents and holiday memories</p></header><main class="shell"><nav id="nav"></nav><div id="views"></div></main><dialog id="editor"><div class="toolbar"><h2 id="editorTitle">Add item</h2><button onclick="document.getElementById('editor').close()">✕</button></div><form id="editForm"><div id="fields" class="formgrid"></div><div class="formactions"><button type="submit" class="primary">Save</button><button type="button" onclick="document.getElementById('editor').close()">Cancel</button></div></form></dialog><div id="toast" role="status"></div><input type="file" id="importFile" accept=".json,application/json" hidden><dialog id="journalEditor"><div class="toolbar"><h2 id="journalEditorTitle">Holiday diary entry</h2><button type="button" onclick="document.getElementById('journalEditor').close()">✕</button></div><form id="journalForm"><div class="formgrid"><div class="field"><label>Place / title</label><input name="title" required maxlength="180"></div><div class="field"><label>Date</label><input name="date" type="date" required></div><div class="field"><label>Latitude (optional)</label><input name="lat" type="number" step="any" min="-90" max="90"></div><div class="field"><label>Longitude (optional)</label><input name="lon" type="number" step="any" min="-180" max="180"></div><div class="field wide"><label>Diary notes</label><textarea name="notes" placeholder="What did you see and do?"></textarea></div><div class="field wide"><label>Photograph (optional)</label><input id="journalImage" type="file" accept="image/*"><small>Photo <script>
'use strict';const KEY='mytravel-v1-data',UNDO_KEY='mytravel-v1-last-deletion',CLOUD_CONFIG='mytravel-cloud-config-v1',CLOUD_PENDING='mytravel-cloud-pending-v1',CLOUD_BASELINE='mytravel-cloud-baseline-v1';const tabs=[['dashboard','Dashboard'],['trips','Trips'],['itinerary','Itinerary'],['journal','Holiday Journal'],['stays','Accommodation'],['transport','Transport'],['vaccines','Vaccinations'],['documents','Documents'],['packing','Packing'],['expenses','Expenses'],['settings','Settings']];
const schemas={trips:[['name','Trip name','text',true],['destination','Destination','text',true],['start','Departure date','date'],['end','Return date','date'],['notes','Notes','textarea']],itinerary:[['date','Date','date'],['time','Time','time'],['title','Activity / place','text',true],['location','Location','text'],['details','Details / booking reference','textarea']],stays:[['name','Hotel / accommodation','text',true],['location','Location','text'],['checkin','Check-in','date'],['checkout','Check-out','date'],['reference','Booking reference','text'],['notes','Notes','textarea']],transport:[['type','Transport type','select',false,['Flight','Train','Car','Bus','Taxi','Other']],['provider','Airline / provider','text'],['from','From','text'],['to','To','text'],['date','Departure date','date'],['time','Departure time','time'],['reference','Booking reference','text'],['notes','Notes','textarea']],vaccines:[['name','Vaccine / medication','text',true],['date','Date received','date'],['dose','Dose / course','text'],['next','Next dose / booster date','date'],['provider','Clinic / provider','text'],['notes','Notes','textarea']],documents:[['name','Document name','text',true],['reference','Reference / number (optional)','text'],['expiry','Expiry date','date'],['location','Where stored','text'],['notes','Notes','textarea']],packing:[['name','Item','text',true],['category','Category','select',false,['Essentials','Clothing','Electronics','Toiletries','Medication','Other']],['notes','Notes','text']],expenses:[['name','Expense','text',true],['amount','Amount','number'],['currency','Currency','select',false,['GBP','INR','USD','EUR','Other']],['date','Date','date'],['category','Category','select',false,['Flights','Hotels','Transport','Food','Activities','Other']],['notes','Notes','textarea']]};
const singular={trips:'trip',itinerary:'activity',stays:'accommodation',transport:'transport',vaccines:'vaccination',documents:'document',packing:'packing item',expenses:'expense'};const titles={trips:'Your trips',itinerary:'Daily itinerary',stays:'Accommodation',transport:'Flights & transport',vaccines:'Vaccination records',documents:'Travel documents',packing:'Packing checklist',expenses:'Travel expenses'};
let data=load(),tab='dashboard',editing=null;function blank(){return {trips:[],itinerary:[],stays:[],transport:[],vaccines:[],documents:[],packing:[],expenses:[],journal:[],activeTrip:null}}function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&typeof o==='object')return {...blank(),...o}}catch(e){}return blank()}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));toast('Saved on this device');cloudChanged()}catch(e){alert('Could not save data. Check available browser storage.')}}function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prettyDate(s){if(!s)return '';let p=s.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s}function currentTrip(){return data.trips.find(x=>x.id===data.activeTrip)||null}function scoped(k){return k==='trips'?data.trips:k==='vaccines'?data.vaccines:(data[k]||[]).filter(x=>x.tripId===data.activeTrip)}function go(k){tab=k;render()}function render(){if(journalMap){journalMap.remove();journalMap=null}document.getElementById('nav').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');document.getElementById('views').innerHTML=tabs.map(([id])=>`<section class="${tab===id?'active':''}" id="view-${id}">${content(id)}</section>`).join('');if(tab==='journal')setTimeout(initJournalMap,0)}
function content(k){if(k==='dashboard')return dashboard();if(k==='settings')return settings();if(k==='journal')return journalContent();let t=currentTrip(),intro=k==='trips'?'Create a trip, then select it to organise the details.':k==='vaccines'?'Your personal vaccination history, kept independently of any trip.':!t?'Create and select a trip on the Trips tab first.':`Currently organising: <strong>${esc(t.name)}</strong>`;let arr=scoped(k),sorted=[...arr].sort((a,b)=>(a.date||a.start||a.checkin||'').localeCompare(b.date||b.start||b.checkin||''));return `<div class="toolbar"><div><h2>${titles[k]}</h2><p class="muted">${intro}</p></div><button class="primary" ${k!=='trips'&&k!=='vaccines'&&!t?'disabled':''} onclick="openEdit('${k}')">+ Add ${singular[k]}</button></div>${k==='vaccines'?'<p class="notice">A personal record only, not medical advice. Confirm recommended vaccines, booster requirements and dates with a travel clinic. Avoid storing highly sensitive medical documents or identification numbers on a shared device.</p>':''}${k==='documents'?'<p class="notice">This section stores notes and references only, not uploaded files. For security, avoid entering full passport numbers or other sensitive credentials.</p>':''}<div class="entries">${sorted.length?sorted.map(x=>entry(k,x)).join(''):'<div class="card muted">No entries yet.</div>'}</div>`}
function entry(k,x){let main=x.name||x.title||x.provider||x.type||'Entry';let sub=schemas[k].filter(([field])=>field!=='name'&&field!=='title'&&field!=='notes'&&field!=='checked').map(([field,label])=>x[field]!==undefined&&x[field]!==''?`${esc(label)}: ${esc(field==='amount'?Number(x[field]).toFixed(2):field==='date'||field==='start'||field==='end'||field==='checkin'||field==='checkout'||field==='expiry'||field==='next'?prettyDate(x[field]):x[field])}`:null).filter(Boolean).join(' · ');return `<div class="entry"><div>${k==='packing'?`<label class="checkline"><input type="checkbox" ${x.checked?'checked':''} onchange="togglePacked('${x.id}',this.checked)"><strong>${esc(main)}</strong></label>`:`<strong>${esc(main)}</strong>`}${sub?`<small>${sub}</small>`:''}${x.notes?`<p class="muted">${esc(x.notes)}</p>`:''}${k==='trips'?`<p><button class="small ${data.activeTrip===x.id?'primary':''}" onclick="chooseTrip('${x.id}')">${data.activeTrip===x.id?'✓ Selected':'Select trip'}</button></p>`:''}</div><div class="actions"><button class="small" onclick="openEdit('${k}','${x.id}')">Edit</button><button class="small danger" onclick="removeItem('${k}','${x.id}')">Delete</button></div></div>`}
function dashboard(){let t=currentTrip(),p=scoped('packing'),count=p.filter(x=>x.checked).length,exp=scoped('expenses'),byCurrency={};exp.forEach(x=>{let c=x.currency||'GBP';byCurrency[c]=(byCurrency[c]||0)+(Number(x.amount)||0)});return `<h2>Travel overview</h2><div class="grid"><div class="card"><h3>Current trip</h3><div class="stat">${t?esc(t.name):'No trip selected'}</div><p class="muted">${t?esc(t.destination||''):'Create a trip to get started.'}</p><p>${t?`${prettyDate(t.start)} ${t.end?'– '+prettyDate(t.end):''}`:''}</p><button onclick="go('trips')">Manage trips</button></div><div class="card"><h3>Planned activities</h3><div class="stat">${scoped('itinerary').length}</div><p class="muted">Items on your itinerary</p><button onclick="go('itinerary')">View itinerary</button></div><div class="card"><h3>Packing progress</h3><div class="stat">${count} / ${p.length}</div><p class="muted">Items packed</p><button onclick="go('packing')">Open checklist</button></div><div class="card"><h3>Vaccination records</h3><div class="stat">${scoped('vaccines').length}</div><p class="muted">Your vaccination history</p><button onclick="go('vaccines')">View records</button></div></div><div class="card"><h3>Recorded expenses</h3><p class="stat">${Object.entries(byCurrency).map(([c,n])=>`${esc(c)} ${n.toFixed(2)}`).join(' · ')||'None yet'}</p><p class="muted">Currencies are shown separately; no exchange rate is assumed.</p></div><div class="card"><h3>Getting started</h3><p>Create a trip, select it, then add accommodation, transport, activities, vaccination notes and packing items. Use Settings to export a JSON backup.</p><p class="notice">Your records (including diary photos) are saved locally. Optional Supabase synchronisation can be enabled in Settings. Keep a JSON backup before your first cloud upload.</p></div>`}
function settings(){return `<h2>Settings & backup</h2>${cloudSettingsHtml()}<div class="card"><h3>Safety & recovery</h3><p class="muted">Trip deletion is blocked when linked records exist. Vaccinations are stored independently of trips. You can undo the most recent deletion on this device.</p><button onclick="undoDeletion()">Undo last deletion</button></div><div class="card"><h3>Export your data</h3><p class="muted">Download a JSON backup containing all trips and their records.</p><button class="primary" onclick="backup()">Download JSON backup</button></div><div class="card"><h3>Restore from backup</h3><p class="muted">Restoring replaces all existing MyTravel data on this device. Export a backup first.</p><button onclick="document.getElementById('importFile').click()">Choose JSON backup</button></div><div class="card"><h3>Data & privacy</h3><p>Records are saved in this browser. If you enable Supabase sync, a copy is also stored in your Supabase project and accessible to devices signed in with the same account. Vaccination notes are personal information: secure your Supabase account and keep backups.</p><p>For medical notes, store only what you need and keep sensitive documents in a secure location.</p></div><div class="card"><h3>Reset</h3><button class="danger" onclick="resetData()">Delete all local MyTravel data</button></div>`}
function openEdit(k,id){if(k!=='trips'&&k!=='vaccines'&&!data.activeTrip)return alert('Please select a trip first.');editing={k,id};let x=id?data[k].find(z=>z.id===id):{};document.getElementById('editorTitle').textContent=(id?'Edit ':'Add ')+singular[k];document.getElementById('fields').innerHTML=schemas[k].map(([field,label,type,required,opts])=>`<div class="field ${type==='textarea'?'wide':''}"><label for="f_${field}">${esc(label)}</label>${type==='textarea'?`<textarea id="f_${field}" name="${field}">${esc(x[field]||'')}</textarea>`:type==='select'?`<select id="f_${field}" name="${field}">${opts.map(o=>`<option ${x[field]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${field}" name="${field}" type="${type}" ${required?'required':''} ${type==='number'?'step="0.01" min="0"':''} value="${esc(x[field]??'')}">`}</div>`).join('');document.getElementById('editor').showModal()}
document.getElementById('editForm').addEventListener('submit',e=>{e.preventDefault();let {k,id}=editing,values=Object.fromEntries(new FormData(e.currentTarget).entries());if(id){let x=data[k].find(z=>z.id===id);Object.assign(x,values)}else{data[k].push({...values,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),tripId:k==='trips'||k==='vaccines'?null:data.activeTrip,checked:false})}if(k==='trips'&&!data.activeTrip)data.activeTrip=data.trips[0].id;save();document.getElementById('editor').close();render()});function chooseTrip(id){data.activeTrip=id;save();render()}function togglePacked(id,checked){let x=data.packing.find(x=>x.id===id);if(x){x.checked=checked;save();render()}}function removeItem(k,id){
 if(k==='trips'){
   const counts=[...Object.keys(schemas),'journal'].filter(s=>s!=='trips'&&s!=='vaccines').map(s=>[s,data[s].filter(x=>x.tripId===id).length]).filter(x=>x[1]);
   if(counts.length){alert('This trip still has linked records ('+counts.map(x=>x[0]+': '+x[1]).join(', ')+'). To protect your information, MyTravel will NOT delete it. You can edit the trip details instead.');return;}
   if(!confirm('Delete this empty trip? Your vaccination history will be kept.'))return;
 }else if(!confirm('Delete this '+singular[k]+'? You can undo the last deletion in Settings.'))return;
 try{localStorage.setItem(UNDO_KEY,JSON.stringify(data))}catch(e){alert('Cannot create safety copy. Nothing has been deleted.');return}
 data[k]=data[k].filter(x=>x.id!==id);
 if(k==='trips'&&data.activeTrip===id)data.activeTrip=data.trips[0]?.id||null;
 save();render();toast('Deleted. Undo available in Settings.');
}
function undoDeletion(){const raw=localStorage.getItem(UNDO_KEY);if(!raw)return alert('No deletion to undo on this device.');if(!confirm('Restore the data saved just before your last deletion? Changes made since that deletion will be replaced.'))return;try{const old=JSON.parse(raw);if(!Array.isArray(old.trips))throw Error('Invalid safety copy');cloudEnabled=false;data={...blank(),...old};save();localStorage.removeItem(UNDO_KEY);render();alert('Previous data restored.')}catch(e){alert('Could not restore: '+e.message)}}
function backup(){let blob=new Blob([JSON.stringify({app:'MyTravel',version:1,exported:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MyTravel_Backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(o.app!=='MyTravel'||!o.data||!Array.isArray(o.data.trips))throw Error('Not a valid MyTravel backup');if(!confirm('Replace all MyTravel data on this device with this backup?'))return;cloudEnabled=false;data={...blank(),...o.data};for(let k of [...Object.keys(schemas),'journal'])if(!Array.isArray(data[k]))data[k]=[];save();render();alert('Backup restored successfully.')}catch(err){alert('Restore failed: '+err.message)}finally{e.target.value=''}});function resetData(){if(confirm('Delete ALL local MyTravel records? This cannot be undone without a backup.')&&confirm('Are you absolutely sure?')){try{localStorage.setItem(UNDO_KEY,JSON.stringify(data))}catch(e){alert('Cannot create safety copy; reset cancelled.');return}cloudEnabled=false;data=blank();save();render();alert('Local data cleared. Cloud data was not deleted.')}}
// Holiday Journal V1.4. GPS is requested only on a user action; no background tracking.
let journalMap=null,journalEditing=null,journalPhoto=null;
function journalItems(){return (data.journal||[]).filter(x=>x.tripId===data.activeTrip).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function journalContent(){const t=currentTrip();if(!t)return `<h2>Holiday Journal</h2><div class="card">Please create and select a trip first. Your journal entries belong to the selected trip.</div>`;
const items=journalItems();return `<div class="toolbar"><div><h2>📍 Holiday Journal</h2><p class="muted">${esc(t.name)} · Keep a map and diary of the places you visit.</p></div><button class="primary" onclick="openJournal()">+ Add diary entry</button></div><div class="card"><div class="journalActions"><button class="primary" onclick="saveCurrentLocation()">📍 Save My Location</button><button onclick="journalLocateMap()">Find me on map</button></div><p class="journalHint">Location permission is requested only when you press a GPS button. Works on HTTPS and requires your permission. You can also enter coordinates manually. A map needs an internet connection.</p><div id="journalMap" role="region" aria-label="Map of saved holiday places"></div><p id="journalMapMessage" class="muted"></p></div><div class="toolbar"><h3>${items.length} saved ${items.length===1?'place':'places'}</h3></div><div class="entries">${items.length?items.map(x=>`<div class="entry"><div style="min-width:0;flex:1"><strong>${esc(x.title)}</strong><small>${esc(prettyDate(x.date))}${Number.isFinite(Number(x.lat))&&x.lat!==''&&x.lon!==''?` · <span class="journalLocation">📍 ${esc(Number(x.lat).toFixed(5))}, ${esc(Number(x.lon).toFixed(5))}</span>`:''}</small>${x.notes?`<p>${esc(x.notes)}</p>`:''}${x.photo?`<img class="journalPhoto" loading="lazy" alt="Photo for ${esc(x.title)}" src="${esc(x.photo)}">`:''}</div><div class="actions"><button class="small" onclick="openJournal('${x.id}')">Edit</button><button class="small danger" onclick="deleteJournal('${x.id}')">Delete</button></div></div>`).join(''):'<div class="card muted">No places saved yet. Tap Save My Location while visiting somewhere, or add an entry manually.</div>'}</div>`}
function initJournalMap(){const el=document.getElementById('journalMap');if(!el)return;if(!window.L){document.getElementById('journalMapMessage').textContent='Map library unavailable. Check your internet connection; diary entries still work.';return}try{journalMap=L.map(el).setView([28.6139,77.2090],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(journalMap);const pts=[];journalItems().forEach(x=>{const lat=Number(x.lat),lon=Number(x.lon);if(x.lat===''||x.lon===''||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return;L.marker([lat,lon]).addTo(journalMap).bindPopup(`<strong>${esc(x.title)}</strong><p>${esc(prettyDate(x.date))}</p>`);pts.push([lat,lon])});if(pts.length===1)journalMap.setView(pts[0],13);else if(pts.length>1)journalMap.fitBounds(pts,{padding:[30,30],maxZoom:13});setTimeout(()=>journalMap?.invalidateSize(true),150);setTimeout(()=>journalMap?.invalidateSize(true),600)}catch(e){document.getElementById('journalMapMessage').textContent='Could not display map: '+e.message}}
function gpsPosition(){return new Promise((resolve,reject)=>{if(!navigator.geolocation){reject(Error('Geolocation is unavailable on this device.'));return}navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:18000,maximumAge:30000})})}
async function saveCurrentLocation(){if(!currentTrip())return alert('Select a trip first.');try{toast('Requesting your location…');const pos=await gpsPosition();openJournal(null,{lat:pos.coords.latitude,lon:pos.coords.longitude})}catch(e){alert('Could not obtain your location: '+e.message+'\nCheck Safari location permissions and try again.')}}
async function journalLocateMap(){try{const pos=await gpsPosition();if(journalMap){journalMap.setView([pos.coords.latitude,pos.coords.longitude],14);L.circleMarker([pos.coords.latitude,pos.coords.longitude],{radius:8}).addTo(journalMap).bindPopup('Your current location').openPopup()}}catch(e){alert('Location unavailable: '+e.message)}}
function openJournal(id=null,coords=null){if(!currentTrip())return alert('Select a trip first.');const x=id?(data.journal||[]).find(z=>z.id===id&&z.tripId===data.activeTrip):null;journalEditing=id;journalPhoto=x?.photo||null;const form=document.getElementById('journalForm');form.reset();form.elements.title.value=x?.title||'';form.elements.date.value=x?.date||new Date().toLocaleDateString('en-CA');form.elements.lat.value=coords?.lat??x?.lat??'';form.elements.lon.value=coords?.lon??x?.lon??'';form.elements.notes.value=x?.notes||'';document.getElementById('journalEditorTitle').textContent=x?'Edit diary entry':'Add diary entry';journalPreview();document.getElementById('journalEditor').showModal()}
function journalPreview(){document.getElementById('journalPhotoPreview').innerHTML=journalPhoto?`<img class="journalPhoto" alt="Selected diary photograph" src="${esc(journalPhoto)}"><p><button type="button" class="small danger" onclick="journalPhoto=null;journalPreview()">Remove photo</button></p>`:''}
function resizeJournalPhoto(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const max=700,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',0.65))}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Cannot read this photo. Try a JPEG or PNG.'))};img.src=url})}
document.getElementById('journalImage').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{journalPhoto=await resizeJournalPhoto(f);journalPreview()}catch(err){alert(err.message)}});
document.getElementById('journalForm').addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget,v=Object.fromEntries(new FormData(f).entries()),lat=v.lat===''?'':Number(v.lat),lon=v.lon===''?'':Number(v.lon);if((lat!==''&&(!Number.isFinite(lat)||Math.abs(lat)>90))||(lon!==''&&(!Number.isFinite(lon)||Math.abs(lon)>180)))return alert('Please enter valid coordinates.');const old=journalEditing?(data.journal||[]).find(x=>x.id===journalEditing):null;const item={id:old?.id||crypto.randomUUID(),tripId:data.activeTrip,title:v.title.trim(),date:v.date,notes:v.notes,lat,lon,photo:journalPhoto||''};if(!item.title)return alert('Enter a place name.');const prior=JSON.stringify(data.journal);if(old)Object.assign(old,item);else data.journal.push(item);try{localStorage.setItem(KEY,JSON.stringify(data))}catch(err){data.journal=JSON.parse(prior);return alert('Could not save. Device storage may be full. Try a smaller photo or use a diary entry without a photo.')}document.getElementById('journalEditor').close();cloudChanged();render();toast('Diary entry saved')});
function deleteJournal(id){const x=(data.journal||[]).find(z=>z.id===id&&z.tripId===data.activeTrip);if(!x||!confirm('Delete this diary entry?'))return;try{localStorage.setItem(UNDO_KEY,JSON.stringify(data))}catch(e){return alert('Could not create safety copy. Deletion cancelled.')}data.journal=data.journal.filter(z=>z.id!==id);save();render()}

// Supabase cloud sync is deliberately opt-in. Never silently replace an existing local record set.
let sb=null,cloudUser=null,cloudEnabled=false,cloudBusy=false,cloudTimer=null,cloudRevision=null,cloudLastSnapshot=null,cloudConfig=null,cloudMessage='Cloud not connected.',cloudMessageClass='';
try{cloudConfig=JSON.parse(localStorage.getItem(CLOUD_CONFIG)||'null')}catch(e){}
function cloudStatus(msg,cls=''){cloudMessage=msg;cloudMessageClass=cls;const el=document.getElementById('cloudStatus');if(el){el.textContent=msg;el.className=cls}const b=document.getElementById('cloudBanner');if(b)b.textContent=msg;}
function cloudSettingsHtml(){return `<div class="card"><h3>☁ Supabase synchronisation</h3><p class="muted">Use the same Supabase project as MyFinance if you wish, but create the separate <code>mytravel_data</code> table first (see the supplied setup guide). Your existing records stay on this device until you explicitly upload them.</p><div class="formgrid"><div class="field"><label>Supabase Project URL</label><input id="travelSbUrl" type="url" placeholder="https://your-project.supabase.co" value="${esc(cloudConfig?.url||'')}"></div><div class="field"><label>Publishable / anon key (never a secret or service-role key)</label><input id="travelSbKey" type="text" autocomplete="off" value="${esc(cloudConfig?.key||'')}"></div></div><div class="cloudactions"><button onclick="connectCloud()">Connect</button><button onclick="signInCloud()">Sign in</button><button onclick="signOutCloud()">Sign out</button></div><p id="cloudStatus" class="${cloudMessageClass||'muted'}">${esc(cloudMessage)}</p><div class="notice"><strong>First setup on your PC:</strong> Download a JSON backup, connect and sign in, then choose <strong>Upload this device to cloud</strong>. On your iPad/iPhone, sign in and choose <strong>Load cloud onto this device</strong>. Never upload an empty device.</div><div class="cloudactions" style="margin-top:12px"><button class="primary" onclick="uploadCloud(true)">↑ Upload this device to cloud</button><button onclick="downloadCloud(true)">↓ Load cloud onto this device</button><button onclick="checkCloud()">Check for cloud changes</button></div><p class="muted">After the first upload or download, edits on this device sync automatically while signed in. The app checks for updates every 30 seconds and when reopened. Unsaved or conflicting changes are never silently overwritten. If changes conflict, the app stops and asks you to choose which copy to keep.</p></div>`}
function cloudChanged(){if(!cloudEnabled||!cloudUser||!sb)return;try{localStorage.setItem(CLOUD_PENDING,'1')}catch(e){}clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>uploadCloud(false),900)}
function validCloudSettings(url,key){return /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)&&!!key&&!/service_role|sb_secret_/i.test(key)}
async function connectCloud(){const url=(document.getElementById('travelSbUrl')?.value||cloudConfig?.url||'').trim().replace(/\/$/,''),key=(document.getElementById('travelSbKey')?.value||cloudConfig?.key||'').trim();if(!validCloudSettings(url,key)){cloudStatus('Enter your Supabase project URL and PUBLIC publishable/anon key.','syncerr');return}if(!window.supabase){cloudStatus('Supabase library could not load. Check internet access.','syncerr');return}cloudConfig={url,key};localStorage.setItem(CLOUD_CONFIG,JSON.stringify(cloudConfig));sb=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'mytravel-auth-v1'}});sb.auth.onAuthStateChange((event,session)=>{const prior=cloudUser?.id;cloudUser=session?.user||null;if(!cloudUser){cloudEnabled=false;cloudRevision=null;cloudLastSnapshot=null;cloudStatus('Signed out — local records are still here.');return}cloudStatus('Signed in. Checking cloud data…');if(event==='SIGNED_IN'&&prior!==cloudUser.id)setTimeout(()=>initialCloudCheck(),0)});try{const {data:auth,error}=await sb.auth.getSession();if(error)throw error;if(auth.session?.user){cloudUser=auth.session.user;await initialCloudCheck()}else cloudStatus('Connected. Sign in to sync.')}catch(e){cloudStatus('Connection error: '+e.message,'syncerr')}}
async function signInCloud(){if(!sb){await connectCloud();if(!sb)return}const email=prompt('Enter your Supabase sign-in email (same account as MyFinance):');if(!email)return;const password=prompt('Enter your Supabase password:');if(password===null)return;cloudStatus('Signing in…');const {error}=await sb.auth.signInWithPassword({email:email.trim(),password});if(error)cloudStatus('Sign-in failed: '+error.message,'syncerr');else await initialCloudCheck()}
async function signOutCloud(){clearTimeout(cloudTimer);cloudEnabled=false;if(sb)await sb.auth.signOut();cloudUser=null;cloudRevision=null;cloudLastSnapshot=null;cloudStatus('Signed out. Local records preserved.')}
function stable(o){if(Array.isArray(o))return '['+o.map(stable).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';return JSON.stringify(o)}function snapshot(){return stable(data)}
function hasRecords(o){return [...Object.keys(schemas),'journal'].some(k=>Array.isArray(o?.[k])&&o[k].length>0)}
// Remember the last confirmed cloud snapshot across browser refreshes. A differing
// local copy is not automatically a conflict when the cloud changed elsewhere.
function baselineId(){return cloudConfig?.url+'|'+cloudUser?.id}
function rememberBaseline(){if(!cloudUser)return;try{localStorage.setItem(CLOUD_BASELINE,JSON.stringify({id:baselineId(),revision:cloudRevision,snapshot:cloudLastSnapshot}))}catch(e){}}
function restoreBaseline(){try{const x=JSON.parse(localStorage.getItem(CLOUD_BASELINE)||'null');if(x?.id===baselineId()&&typeof x.snapshot==='string'){cloudRevision=x.revision;cloudLastSnapshot=x.snapshot;return true}}catch(e){}cloudRevision=null;cloudLastSnapshot=null;return false}

async function cloudRow(){if(!sb||!cloudUser)throw Error('Sign in first');const {data:row,error}=await sb.from('mytravel_data').select('data,revision').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;return row}
async function initialCloudCheck(){
 if(!sb||!cloudUser||cloudBusy)return;
 try{
  const row=await cloudRow();
  if(!row){cloudEnabled=false;cloudRevision=null;cloudLastSnapshot=null;cloudStatus('No MyTravel cloud records yet. On your PC, back up then choose Upload this device to cloud.','syncwarn');return}
  const local=snapshot(),remote=stable(row.data),hadBaseline=restoreBaseline();
  if(local===remote){cloudRevision=row.revision;cloudLastSnapshot=remote;cloudEnabled=true;rememberBaseline();localStorage.removeItem(CLOUD_PENDING);cloudStatus('Cloud up to date. Automatic sync enabled.','syncok');return}
  if(!hasRecords(data)){await downloadCloud(false);return}
  if(hadBaseline&&local===cloudLastSnapshot){await downloadCloud(false);return}
  if(hadBaseline&&remote===cloudLastSnapshot){cloudEnabled=true;cloudRevision=row.revision;cloudLastSnapshot=remote;rememberBaseline();cloudStatus('Local changes detected. Uploading safely…','syncwarn');await uploadCloud(false);return}
  cloudEnabled=false;
  cloudStatus('Local and cloud data differ. Export a JSON backup before choosing Load cloud or Upload this device.','syncwarn');
 }catch(e){cloudEnabled=false;cloudStatus('Cloud check failed: '+e.message,'syncerr')}
}
async function uploadCloud(manual){if(!sb||!cloudUser){cloudStatus('Please connect and sign in first.','syncwarn');return}if(cloudBusy)return;clearTimeout(cloudTimer);if(manual){if(!hasRecords(data)){alert('This device has no records. Upload cancelled to protect your cloud data.');return}if(!confirm('Upload ALL records from THIS device to Supabase? This may replace records saved from another device. Make a JSON backup first.'))return}cloudBusy=true;try{const row=await cloudRow();if(!manual){if(!cloudEnabled){cloudStatus('Automatic upload paused. Choose a cloud copy first.','syncwarn');return}if(row&&row.revision!==cloudRevision){cloudEnabled=false;cloudStatus('Cloud changed on another device. Automatic upload stopped to prevent overwriting. Use Check for cloud changes.','syncwarn');return}if(!row&&cloudRevision!==null){cloudEnabled=false;cloudStatus('Cloud record is missing. Automatic upload stopped.','syncerr');return}}const next=Number(row?.revision||0)+1;let result;if(row){result=await sb.from('mytravel_data').update({data,revision:next}).eq('user_id',cloudUser.id).eq('revision',row.revision).select('revision').maybeSingle();if(!result.error&&!result.data)throw Error('Another device updated the cloud while saving. Upload cancelled.')}else{result=await sb.from('mytravel_data').insert({user_id:cloudUser.id,data,revision:next}).select('revision').single()}if(result.error)throw result.error;cloudRevision=next;cloudLastSnapshot=snapshot();cloudEnabled=true;rememberBaseline();localStorage.removeItem(CLOUD_PENDING);cloudStatus('Cloud saved successfully. Automatic sync enabled.','syncok')}catch(e){cloudStatus('Cloud upload failed; local records are safe: '+e.message,'syncerr')}finally{cloudBusy=false;if(cloudEnabled&&cloudLastSnapshot!==snapshot())cloudChanged()}}
async function downloadCloud(manual){if(!sb||!cloudUser){cloudStatus('Please connect and sign in first.','syncwarn');return}if(cloudBusy)return;if(manual&&hasRecords(data)&&!confirm('Replace this device’s local records with the cloud copy? Download a JSON backup first.'))return;clearTimeout(cloudTimer);cloudBusy=true;try{const row=await cloudRow();if(!row||!row.data||!Array.isArray(row.data.trips))throw Error('No valid MyTravel data found in cloud');const next={...blank(),...row.data};for(const k of [...Object.keys(schemas),'journal'])if(!Array.isArray(next[k]))next[k]=[];localStorage.setItem(KEY,JSON.stringify(next));data=next;cloudRevision=row.revision;cloudLastSnapshot=snapshot();cloudEnabled=true;rememberBaseline();localStorage.removeItem(CLOUD_PENDING);render();cloudStatus('Cloud loaded. Automatic sync enabled.','syncok')}catch(e){cloudStatus('Cloud download failed; local records were not changed: '+e.message,'syncerr')}finally{cloudBusy=false}}
async function checkCloud(){
 if(!sb||!cloudUser){cloudStatus('Sign in first.','syncwarn');return}
 if(cloudBusy)return;
 try{
  const row=await cloudRow();if(!row){cloudStatus('No cloud data found.','syncwarn');return}
  if(cloudLastSnapshot===null)restoreBaseline();
  const local=snapshot(),remote=stable(row.data);
  if(local===remote){cloudRevision=row.revision;cloudLastSnapshot=remote;cloudEnabled=true;rememberBaseline();cloudStatus('Cloud up to date.','syncok');return}
  if(local===cloudLastSnapshot||!hasRecords(data)){await downloadCloud(false);return}
  if(remote===cloudLastSnapshot){cloudEnabled=true;cloudRevision=row.revision;cloudStatus('Uploading local changes…','syncwarn');await uploadCloud(false);return}
  cloudEnabled=false;cloudStatus('Both local and cloud have changes. Back up each device before choosing which copy to keep.','syncwarn');
 }catch(e){cloudStatus('Cloud check failed: '+e.message,'syncerr')}
}
window.addEventListener('focus',()=>{if(cloudUser&&!cloudBusy)checkCloud()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudEnabled&&!cloudBusy&&cloudLastSnapshot===snapshot())checkCloud()});

setInterval(()=>{if(cloudUser&&!cloudBusy&&!document.hidden)checkCloud()},30000);render();if(cloudConfig)setTimeout(()=>connectCloud(),0);
</script></body></html>
